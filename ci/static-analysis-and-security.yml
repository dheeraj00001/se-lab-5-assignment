name: Static Code Analysis and Security Scanning Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Static Analysis & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit flake8

      - name: Run Flake8 (PEP 8 Style Checker)
        run: |
          echo "=== Running Flake8 ==="
          flake8 pharmacy_manager.py --max-line-length=79 --show-source --statistics

      - name: Run Pylint (Quality Gate >= 9.5)
        run: |
          echo "=== Running Pylint Quality Gate ==="
          pylint pharmacy_manager.py --fail-under=9.5

      - name: Run Bandit (Security Vulnerability Scan on Production Code)
        run: |
          echo "=== Running Bandit Security Scanner ==="
          bandit -r pharmacy_manager.py -v

      - name: Run Security Scanner Demo (Topic 19 Anti-Pattern Detection)
        run: |
          echo "=== Running Security Scanner on Anti-Pattern Demo ==="
          bandit -r security_scan_demo.py -f txt || true
